name: Publish private install package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.1
  push:
    paths:
      - '.release-trigger-v1.0.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and verify module
        run: python tools/build_module.py

      - name: Create private-repository release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || 'v1.0.1' }}
          name: VIVE Focus Vision Hybrid ${{ inputs.tag || 'v1.0.1' }}
          body: |
            Install with VRCFaceTracking: Module Registry -> Install Module from .zip.
            This release belongs to a private repository and is only visible to authorized users.
          files: dist/VRCFT_VIVE_FocusVision_Hybrid_v1.0.1.zip
          fail_on_unmatched_files: true

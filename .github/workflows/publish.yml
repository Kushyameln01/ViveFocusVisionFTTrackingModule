name: Publish install package

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.2

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v1.0.2' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and verify module
        run: python tools/build_module.py

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: VIVE Focus Vision Hybrid ${{ env.RELEASE_TAG }}
          body: |
            VRCFaceTracking module for VIVE Focus Vision.

            v1.0.2 adds automatic Face Tracking recovery when an initialized Eye or Lip callback stream stalls for 5 seconds while the HMD streaming connection remains active.

            IMPORTANT: Do not enable this module together with HTC's original ViveStreamingFaceTrackingModule. Both modules share the same VIVE Streaming native SDK/IPC and can conflict.

            Install from the VRCFaceTracking Module Registry after registry approval, or manually with Module Registry -> Install Module from .zip.
          files: dist/VRCFT_VIVE_FocusVision_Hybrid_v1.0.2.zip
          fail_on_unmatched_files: true

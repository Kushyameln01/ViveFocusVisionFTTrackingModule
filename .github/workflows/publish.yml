name: Publish install package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and verify module
        run: python tools/build_module.py

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: VIVE Focus Vision Hybrid ${{ inputs.tag }}
          body: |
            VRCFaceTracking module for VIVE Focus Vision.

            IMPORTANT: Do not enable this module together with HTC's original ViveStreamingFaceTrackingModule. Both modules share the same VIVE Streaming native SDK/IPC and can conflict.

            Install from the VRCFaceTracking Module Registry after registry approval, or manually with Module Registry -> Install Module from .zip.
          files: dist/VRCFT_VIVE_FocusVision_Hybrid_v1.0.1.zip
          fail_on_unmatched_files: true
